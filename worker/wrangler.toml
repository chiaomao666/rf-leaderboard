name = "rf-ranking-monitor-api"
main = "src/index.js"
compatibility_date = "2026-08-31"

[[d1_databases]]
binding = "DB"
database_name = "rf-ranking-monitor"
database_id = "5176d08d-25bc-4777-a9d0-b5fed50fd5a4"

[vars]
ALLOWED_ORIGIN = "https://chiaomao666.github.io"
GAME_PLAYER_ID = "832459"
# 只有在 Worker 連遊戲伺服器被拒絕（疑似檢查 Origin）時才需要打開：
# GAME_ORIGIN = "..."

# 每小時第 3 分鐘自動抓取一次排行榜與積分（UTC）
[triggers]
crons = ["3 * * * *"]
